services:
  # ----------------------------------------------------------------------------
  # Backend Web Service on Render
  # ----------------------------------------------------------------------------
  - type: web
    name: mandi-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health

    envVars:
      - key: PORT
        value: 8080

      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

      - key: MANDI_CORS_ALLOWED_ORIGINS
        value: https://apnaa-mandi.netlify.app,https://*.netlify.app,http://localhost:5173,http://localhost:3000

      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://mysql-bcead60-mandi-platform.l.aivencloud.com:12044/defaultdb?sslMode=REQUIRED&useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&sessionVariables=sql_require_primary_key=0

      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin

      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      - key: JWT_SECRET
        sync: false