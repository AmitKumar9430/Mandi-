server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: mandi-backend

  # ============================================================
  # DATABASE CONFIGURATION
  # ============================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:mandidb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ============================================================
  # JACKSON
  # ============================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      FAIL_ON_EMPTY_BEANS: false
    time-zone: UTC

  # ============================================================
  # FILE UPLOAD
  # ============================================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


# ==============================================================
# MANDI APPLICATION CONFIGURATION
# ==============================================================
mandi:

  # ============================================================
  # JWT
  # ============================================================
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D597133743677397A24432646294A404D635166546A576E5A7234753778214125442A}
    expiration-ms: 86400000

  # ============================================================
  # CORS
  # ============================================================
  cors:
    allowed-origins: ${MANDI_CORS_ALLOWED_ORIGINS:https://apnaa-mandi.netlify.app,https://*.netlify.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

  # ============================================================
  # SEED DATA
  # ============================================================
  seed-data:
    enabled: true

  # ============================================================
  # OPENAI & AI ASSISTANT CONFIGURATION
  # ============================================================
  openai:
    api-key: ${OPENAI_API_KEY:}

  # ============================================================
  # SMS & TELECOM GATEWAY CONFIGURATION
  # ============================================================
  sms:
    enabled: true
    fast2sms-api-key: ${FAST2SMS_API_KEY:}
    msg91-auth-key: ${MSG91_AUTH_KEY:}

  # ============================================================
  # EMAILJS NOTIFICATION GATEWAY CONFIGURATION
  # ============================================================
  emailjs:
    service-id: ${EMAILJS_SERVICE_ID:service_9qysbj8}
    public-key: ${EMAILJS_PUBLIC_KEY:mZNHwW-FUTEuLUHWu}
    registration-template-id: ${EMAILJS_REGISTRATION_TEMPLATE_ID:template_kmzf1sl}
    login-template-id: ${EMAILJS_LOGIN_TEMPLATE_ID:template_e25o3p8}
    private-key: ${EMAILJS_PRIVATE_KEY:miSYTFDFm8kUATVBf57oa}